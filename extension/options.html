<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>gproxy options</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 32px 24px;
    background: #141416; color: #e8e8ea;
    font: 14px/1.5 system-ui, -apple-system, sans-serif;
  }
  .wrap { max-width: 460px; margin: 0 auto; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  .sub { color: #9a9aa2; margin: 0 0 28px; }
  label { display: block; margin: 0 0 18px; font-weight: 600; }
  input[type="text"], fieldset {
    width: 100%; margin-top: 6px;
    background: #1e1e22; color: #e8e8ea;
    border: 1px solid #3a3a42; border-radius: 6px;
  }
  input[type="text"] { padding: 8px 10px; font: inherit; }
  input[type="text"]:focus { outline: 1px solid #6a9fdb; }
  fieldset { border: 0; padding: 0; margin: 0 0 22px; }
  fieldset legend { font-weight: 600; padding: 0; margin-bottom: 6px; }
  .radio { display: flex; align-items: center; gap: 8px; margin: 6px 0; font-weight: 400; }
  .hint { color: #9a9aa2; font-weight: 400; font-size: 12.5px; margin: 6px 0 0; }
  .row { display: flex; align-items: center; gap: 12px; }
  button {
    background: #2f6fd6; color: #fff; border: 0; border-radius: 6px;
    padding: 8px 18px; font: inherit; font-weight: 600; cursor: pointer;
  }
  button:hover { background: #3b7de2; }
  #saved { color: #7dd87d; opacity: 0; transition: opacity .25s; }
  #saved.show { opacity: 1; }
  #err { color: #ff8a80; min-height: 20px; margin-top: 10px; font-size: 13px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>gproxy</h1>
  <p class="sub">Stream a Chrome tab from your work Mac into this browser.</p>

  <label>Agent URL
    <input type="text" id="agentUrl" placeholder="http://work-mac:7654" spellcheck="false">
  </label>

  <label>Token
    <input type="text" id="token" placeholder="32-character access token" autocomplete="off" spellcheck="false">
    <p class="hint">The token is printed by the work-Mac installer — check the output of
    deploy/install.sh (or the agent's launchd log) on the work Mac.</p>
  </label>

  <fieldset>
    <legend>When the toolbar button is clicked</legend>
    <div class="radio"><input type="radio" id="mode-replace" name="mode" value="replace"><label for="mode-replace" style="margin:0">Replace the current tab with the viewer</label></div>
    <div class="radio"><input type="radio" id="mode-newtab" name="mode" value="newtab"><label for="mode-newtab" style="margin:0">Open the viewer in a new tab</label></div>
  </fieldset>

  <div class="row">
    <button id="save">Save</button>
    <span id="saved">Saved</span>
  </div>
  <div id="err"></div>
</div>
<script src="options.js"></script>
</body>
</html>
